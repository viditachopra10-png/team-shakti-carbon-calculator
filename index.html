<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Carbon Footprint Calculator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">

<h1>🌱 Digital Carbon Footprint Calculator</h1>

<p class="intro">
Discover your impact on the planet and learn how to reduce your carbon emissions.
</p>


<form id="carbonForm" onsubmit="return false;">


<label>
🚗 How do you usually travel?
</label>

<select id="travel">
<option value="20">Public Transport</option>
<option value="50">Private Vehicle</option>
<option value="80">Multiple Vehicles</option>
</select>



<label>
💡 How many hours of electricity do you use daily?
</label>

<input type="number" id="electricity" min="0" placeholder="Example: 8">


<label>
❄️ How many hours is AC used daily?
</label>

<input type="number" id="ac" min="0" placeholder="Example: 4">



<label>
🔥 What cooking fuel do you use?
</label>

<select id="fuel">

<option value="30">LPG</option>

<option value="15">Electric Cooking</option>

<option value="60">Coal/Wood</option>

</select>




<label>
⚡ Do you use a generator?
</label>


<select id="generator">

<option value="0">No</option>

<option value="40">Yes</option>

</select>




<button type="button" onclick="calculateCarbon()">
Calculate My Carbon Footprint 🌍
</button>


</form>



<div id="result">

</div>


</div>


<script src="script.js"></script>

</body>

</html>
